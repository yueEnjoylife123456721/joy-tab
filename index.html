<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yumi AI · 联网搜索版</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-2: #0e1a2e;
      --panel: rgba(19, 28, 45, 0.9);
      --panel-2: rgba(10, 16, 28, 0.76);
      --line: rgba(143, 164, 210, 0.22);
      --text: #edf4ff;
      --muted: #a8bad7;
      --cyan: #6fe9ff;
      --acid: #d5ff70;
      --purple: #8f7bff;
      --pink: #ff6bb0;
      --danger: #ff8ca7;
      --shadow: 0 28px 70px rgba(1, 8, 17, 0.62);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, #102240 0%, #07111f 30%, #040914 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(980px, 100%);
      min-height: 760px;
      background: rgba(9, 15, 27, 0.8);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 13, 22, 0.92);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--acid));
      box-shadow: 0 0 18px rgba(111, 233, 255, 0.9);
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: min(78%, 760px);
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      animation: in 0.3s ease;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #07131d;
      border-bottom-right-radius: 6px;
      font-weight: 600;
    }

    .message.ai {
      align-self: flex-start;
      background: rgba(17, 26, 40, 0.82);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
      color: var(--text);
    }

    .message.err {
      align-self: flex-start;
      background: rgba(100, 28, 49, 0.65);
      border: 1px solid rgba(255, 140, 167, 0.5);
      color: #ffdfe9;
    }

    .message.search {
      border: 1px solid rgba(111, 233, 255, 0.4);
      background: rgba(8, 29, 38, 0.8);
    }

    .typing {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 120px;
      background: rgba(17, 26, 40, 0.82);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .typing span {
      width: 7px;
      height: 7px;
      display: inline-block;
      border-radius: 50%;
      background: var(--acid);
      animation: blink 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.16s; }
    .typing span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-4px); }
    }

    .composer {
      border-top: 1px solid var(--line);
      background: rgba(8, 12, 21, 0.94);
      padding: 14px 16px 18px;
    }

    .composer-row {
      display: flex;
      gap: 12px;
      align-items: end;
    }

    textarea {
      flex: 1;
      min-height: 56px;
      max-height: 180px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(9, 13, 22, 0.7);
      color: var(--text);
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: rgba(111, 233, 255, 0.7);
      box-shadow: 0 0 0 3px rgba(111, 233, 255, 0.12);
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 0 18px;
      min-height: 56px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }

    .search-btn {
      background: rgba(111, 233, 255, 0.08);
      color: var(--cyan);
      border: 1px solid rgba(111, 233, 255, 0.35);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--acid), #c6ff85);
      color: #09210d;
      box-shadow: 0 18px 30px rgba(213, 255, 112, 0.18);
    }

    @media (max-width: 640px) {
      body { padding: 14px; }
      .header { padding: 14px 16px; }
      .brand { letter-spacing: 0.04em; }
      .status { display: none; }
      .composer-row { flex-wrap: wrap; }
      .search-btn, .send-btn { flex: 1 1 100%; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span>Yumi AI</span>
      </div>
      <div class="status">联网搜索已开启</div>
    </div>

    <div class="chat">
      <div class="messages" id="messages">
        <div class="message ai">
          你好，我是 Yumi。你可以直接提问，或者点击“联网搜索”让我先查一下最新信息。
        </div>
      </div>

      <div class="composer">
        <div class="composer-row">
          <textarea id="input" rows="1" placeholder="问点什么？例如：今天的 AI 热点、搜索‘OpenAI 最新消息’……"></textarea>
          <button class="btn search-btn" id="searchBtn" type="button">联网搜索</button>
          <button class="btn send-btn" id="sendBtn" type="button">发送</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const searchBtn = document.getElementById('searchBtn');

    function addMessage(text, type = 'ai') {
      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span> 搜索中';
      messagesEl.appendChild(typing);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return typing;
    }

    function removeLastTyping() {
      const typing = messagesEl.querySelector('.typing');
      if (typing) typing.remove();
    }

    function isSearchIntent(prompt) {
      const text = prompt.toLowerCase();
      const patterns = [
        '搜索', '查一下', '联网', '最新', '新闻', '资讯', '实时', '今天', '最近', '热点',
        'what is', 'who is', 'latest', 'news', 'search for', 'look up', 'find', 'update'
      ];
      return patterns.some(item => text.includes(item));
    }

    function normalizeSearchText(raw) {
      return raw.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '').trim();
    }

    function openSearchInBrowser(query) {
      const url = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    async function fetchSearchSummary(query) {
      const urls = [
        'https://r.jina.ai/http://www.bing.com/search?q=' + encodeURIComponent(query),
        'https://r.jina.ai/http://https://www.bing.com/search?q=' + encodeURIComponent(query)
      ];

      for (const url of urls) {
        try {
          const res = await fetch(url, { mode: 'cors' });
          if (!res.ok) continue;
          const text = await res.text();
          const cleaned = text
            .replace(/\s*\[[^\]]+\]\([^)]*\)/g, '')
            .replace(/\n{3,}/g, '\n\n')
            .trim();

          if (cleaned && cleaned.length > 20) {
            return cleaned.slice(0, 1200);
          }
        } catch (err) {
          // Ignore and fallback below.
        }
      }

      return null;
    }

    async function handleAsk(prompt) {
      const question = normalizeSearchText(prompt);
      if (!question) return;

      addMessage(question, 'user');

      const shouldSearch = isSearchIntent(question);
      const typing = addTyping();

      try {
        let answer = '我先帮你整理一下这个问题。';

        if (shouldSearch) {
          const summary = await fetchSearchSummary(question);
          if (summary) {
            answer = '我已联网检索并整理了相关信息：\n\n' + summary;
          } else {
            answer = '我已尝试联网搜索，但当前环境无法直接抓取搜索结果；已为你在新窗口打开 Bing 搜索。\n\n你也可以直接查看： ' + question;
            openSearchInBrowser(question);
          }
        } else {
          answer = '我可以直接回答，不过你也可以在问题里加入“搜索/查一下/最新”等关键词来触发联网搜索。\n\n例如：搜索 OpenAI 最新消息\n查一下今天的 AI 热点';
        }

        removeLastTyping();
        addMessage(answer, shouldSearch ? 'search' : 'ai');
      } catch (error) {
        removeLastTyping();
        addMessage('联网搜索失败，但你可以直接在新窗口中搜索：' + question + '\n\n' + error.message, 'err');
        openSearchInBrowser(question);
      }
    }

    function sendCurrentPrompt() {
      const prompt = inputEl.value.trim();
      if (!prompt) {
        inputEl.focus();
        return;
      }

      handleAsk(prompt);
      inputEl.value = '';
      inputEl.style.height = 'auto';
    }

    sendBtn.addEventListener('click', sendCurrentPrompt);
    searchBtn.addEventListener('click', () => {
      const prompt = inputEl.value.trim() || 'AI 热点资讯';
      inputEl.value = prompt;
      handleAsk(prompt);
      inputEl.value = '';
    });

    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendCurrentPrompt();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    });
  </script>
</body>
</html>
