<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yumi AI · 联网搜索版</title>
  <style>
    :root {
      --bg: #07111f;
      --bg-2: #0e1a2e;
      --panel: rgba(19, 28, 45, 0.9);
      --panel-2: rgba(10, 16, 28, 0.76);
      --line: rgba(143, 164, 210, 0.22);
      --text: #edf4ff;
      --muted: #a8bad7;
      --cyan: #6fe9ff;
      --acid: #d5ff70;
      --purple: #8f7bff;
      --pink: #ff6bb0;
      --danger: #ff8ca7;
      --shadow: 0 28px 70px rgba(1, 8, 17, 0.62);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top left, #102240 0%, #07111f 30%, #040914 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(980px, 100%);
      min-height: 760px;
      background: rgba(9, 15, 27, 0.8);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 13, 22, 0.92);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--acid));
      box-shadow: 0 0 18px rgba(111, 233, 255, 0.9);
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 82%;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #081621;
      border-bottom-right-radius: 6px;
      font-weight: 600;
    }

    .msg.ai {
      align-self: flex-start;
      background: rgba(18, 28, 43, 0.92);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .msg.err {
      align-self: flex-start;
      background: rgba(39, 17, 27, 0.8);
      color: #ffd3df;
      border: 1px solid rgba(255, 139, 171, 0.45);
    }

    .msg.loading {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      background: rgba(18, 28, 43, 0.7);
      border: 1px dashed var(--line);
      border-bottom-left-radius: 6px;
    }

    .msg.loading .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--acid);
      display: inline-block;
      animation: blink 1s ease-in-out infinite;
    }

    .msg.loading .dot:nth-child(2) { animation-delay: .16s; }
    .msg.loading .dot:nth-child(3) { animation-delay: .32s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 14px 16px 18px;
      border-top: 1px solid var(--line);
      background: rgba(10, 16, 28, 0.9);
    }

    textarea {
      flex: 1;
      min-height: 52px;
      max-height: 160px;
      resize: none;
      border: 1px solid var(--line);
      background: rgba(9, 16, 27, 0.92);
      color: var(--text);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      border-color: rgba(111, 233, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(111, 233, 255, 0.12);
    }

    .send {
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--acid), #b9ff62);
      color: #071814;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 18px;
      height: 52px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 12px 28px rgba(213, 255, 112, 0.28);
    }

    .send:hover {
      transform: translateY(-1px);
    }

    .suggestions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 18px 0;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(18, 28, 43, 0.8);
      color: var(--cyan);
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .chip:hover {
      border-color: rgba(111, 233, 255, 0.7);
      transform: translateY(-1px);
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .app { min-height: 92vh; border-radius: 20px; }
      .header { padding: 14px 16px; }
      .brand { letter-spacing: 0.04em; font-size: 14px; }
      .status { font-size: 10px; }
      .composer { padding: 12px 12px 14px; }
      .suggestions { padding: 10px 12px 0; }
      .msg { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand"><span class="brand-dot"></span> Yumi AI</div>
      <div class="status">联网搜索模式</div>
    </div>

    <div class="chat">
      <div class="suggestions">
        <button class="chip" data-query="帮我搜索最近的 AI 热点新闻">AI 热点</button>
        <button class="chip" data-query="查一下最近的前端技术趋势">前端趋势</button>
        <button class="chip" data-query="用中文总结一下这个项目的结构">项目结构</button>
      </div>

      <div class="messages" id="messages">
        <div class="msg ai">你好，我是 Yumi。你可以直接问我任何问题；如果你带上“搜索 / 查一下 / 最新 / 新闻 / 资讯”等关键词，我会优先联网获取最新信息。</div>
      </div>

      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入你的问题… 例如：帮我搜索最近的 AI 热点新闻"></textarea>
        <button class="send" id="send">发送</button>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    const pushMessage = (text, type = 'ai') => {
      const el = document.createElement('div');
      el.className = `msg ${type}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };

    const pushLoading = () => {
      const el = document.createElement('div');
      el.className = 'msg loading';
      el.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span> 搜索中';
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    };

    const removeLoading = () => {
      const loading = messagesEl.querySelector('.msg.loading');
      if (loading) loading.remove();
    };

    const normalize = (text) => text.trim().replace(/\r\n+/g, '\n');

    const isSearchIntent = (text) => {
      const q = text.toLowerCase();
      const keywords = [
        '搜索', '查一下', '最新', '新闻', '资讯', '热点', '实时', '最近',
        'search', 'latest', 'news', 'find', 'look up', 'what is', 'who is'
      ];
      return keywords.some(k => q.includes(k));
    };

    const openBing = (query) => {
      const url = 'https://www.bing.com/search?q=' + encodeURIComponent(query);
      window.open(url, '_blank', 'noopener,noreferrer');
    };

    async function fetchSearchSummary(query) {
      const candidates = [
        'https://r.jina.ai/http://www.bing.com/search?q=' + encodeURIComponent(query),
        'https://r.jina.ai/http://https://www.bing.com/search?q=' + encodeURIComponent(query)
      ];

      for (const url of candidates) {
        try {
          const res = await fetch(url, { mode: 'cors' });
          if (!res.ok) continue;
          const text = await res.text();
          const clean = text
            .replace(/\s*\[[^\]]+\]\([^)]*\)/g, '')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
          if (clean && clean.length > 30) return clean.slice(0, 1400);
        } catch (e) {
          // ignore and continue
        }
      }
      return null;
    }

    async function answerQuestion(query) {
      const q = normalize(query);
      if (!q) return;

      pushMessage(q, 'user');
      const loading = pushLoading();

      try {
        const searchMode = isSearchIntent(q);
        let answer = '我可以直接回答你。不过如果你想要最新信息，请在问题中加入“搜索 / 最新 / 新闻 / 资讯”等关键词。';

        if (searchMode) {
          const summary = await fetchSearchSummary(q);
          if (summary) {
            answer = '我已尝试联网整理相关信息：\n\n' + summary;
          } else {
            answer = '当前环境无法直接拉取搜索摘要，我已经为你打开 Bing 搜索页，方便你查看最新结果。\n\n搜索词：' + q;
            openBing(q);
          }
        }

        removeLoading();
        pushMessage(answer, 'ai');
      } catch (e) {
        removeLoading();
        pushMessage('搜索失败了，但你可以直接打开 Bing 搜索页查看最新信息。\n\n搜索词：' + q, 'err');
        openBing(q);
      }
    }

    const submit = () => {
      const value = normalize(inputEl.value);
      if (!value) {
        inputEl.focus();
        return;
      }
      answerQuestion(value);
      inputEl.value = '';
      inputEl.style.height = 'auto';
    };

    sendBtn.addEventListener('click', submit);

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submit();
      }
    });

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
    });

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const q = chip.dataset.query;
        inputEl.value = q;
        inputEl.focus();
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
      });
    });
  </script>
</body>
</html>
